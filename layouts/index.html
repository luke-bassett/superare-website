<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A Portland-based bike racing team looking to instill friendly competition, inclusion, and a love for bike racing.">
  <title>{{ .Site.Title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>

  {{ partial "nav.html" . }}

  <!-- HERO -->
  <section class="hero">
    <p class="hero-photo-credit">Photo by <a href="https://www.instagram.com/jayortiz/" target="_blank" rel="noopener">@jayortiz</a> &nbsp;·&nbsp; <a href="https://jayortizphotography.pixieset.com/" target="_blank" rel="noopener">jayortizphotography.pixieset.com</a></p>
    <div class="hero-inner">
      <img src="/images/logos/vs2_color-SR.svg" alt="Superare Racing" class="hero-logo" height="100">
      <div class="hero-text">
        <h1>Superare<br>Racing</h1>
        <p class="hero-location">Portland, Oregon &nbsp;·&nbsp; Bike Racing</p>
      </div>
    </div>
  </section>

  <!-- SPONSORS -->
  <section class="sponsors" id="sponsors">
    <div class="section-inner">
      <h2>Our Partners</h2>
      <div class="sponsor-grid">

        <a href="https://www.cyclepathpdx.com/" class="sponsor-card" target="_blank" rel="noopener">
          <img src="/images/sponsors/cyclepath.avif" alt="Cyclepath PDX">
        </a>

        <a href="https://www.cafecincosietepdx.com/" class="sponsor-card" target="_blank" rel="noopener">
          <img src="/images/sponsors/cincosiete.gif" alt="Cafe Cinco Siete PDX">
        </a>

        <a href="https://www.skratchlabs.com/" class="sponsor-card sponsor-card--dark" target="_blank" rel="noopener">
          <img src="/images/sponsors/skratch.svg" alt="Skratch Labs">
        </a>

        <a href="https://primoscycles.com/" class="sponsor-card" target="_blank" rel="noopener">
          <img src="/images/sponsors/primos.avif" alt="Primos Cycles">
        </a>

        <a href="https://www.castelli-cycling.com/" class="sponsor-card" target="_blank" rel="noopener">
          <img src="/images/sponsors/castelli.svg" alt="Castelli">
        </a>

        <a href="https://ridehifi.com/" class="sponsor-card" target="_blank" rel="noopener">
          <img src="/images/sponsors/ridehifi.avif" alt="Ride HiFi">
        </a>

      </div>
    </div>
  </section>

  <!-- JOURNAL BANNER -->
  <section class="race-banner">
    <div class="section-inner">
      <span class="section-label section-label--light">Racing</span>
      <h2>Journal</h2>
      <p class="race-meta">Race results &amp; dispatches from the team.</p>
      <a href="/journal/" class="btn">Read the Journal &rarr;</a>
    </div>
  </section>

  {{ partial "footer.html" . }}

</body>
</html>
